<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><title>Halloween Monsters — klekwow</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:transparent}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script>
/* Параметры (через ?): channel=klekwow  ttl=210 (сек до исчезновения)  size=1  max=60  bubbles=0  fog=0  bg=1 (фон для теста)  demo=1 */
const Q=new URLSearchParams(location.search),CH=(Q.get('channel')||'klekwow').toLowerCase(),TTL=(+Q.get('ttl')||210)*1000,
BUB=Q.get('bubbles')!=='0',FOG=Q.get('fog')!=='0',MAX=+Q.get('max')||60,SZ=+Q.get('size')||1;
const cv=document.getElementById('c'),g=cv.getContext('2d');
if(!g.roundRect)g.roundRect=function(x,y,w,h){this.rect(x,y,w,h)};
let W,H;
function rs(){const d=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;g.setTransform(d,0,0,d,0,0)}
addEventListener('resize',rs);rs();
if(Q.get('bg'))document.body.style.background='radial-gradient(ellipse at 50% 0%,#3b1d5a,#120a1c 70%)';

const R=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.random()*a.length|0];
const T={mummy:{n:['мумия','mummy'],sp:44},zombie:{n:['зомби','zombie'],sp:28},skeleton:{n:['скелет','skeleton'],sp:62},
vampire:{n:['вампир','vampire'],sp:55},ghost:{n:['призрак','ghost'],sp:38},pumpkin:{n:['тыква','pumpkin'],sp:50},
witch:{n:['ведьма','witch'],sp:46},werewolf:{n:['оборотень','werewolf'],sp:88},frank:{n:['франкенштейн','frankenstein','франк'],sp:34}};
const K=Object.keys(T);
const P={mummy:{skin:'#d8c9a0',body:'#d8c9a0',leg:'#cdbd91'},zombie:{skin:'#86b36b',body:'#4a5d8a',leg:'#3b3f66'},
skeleton:{skin:'#efe9d8',body:'#1a1222',leg:'#efe9d8'},vampire:{skin:'#e9ddd5',body:'#1c1226',leg:'#15101c',arm:'#2a1838'},
ghost:{skin:'#eef6ff',body:'#eef6ff',leg:'#eef6ff'},pumpkin:{skin:'#f28c1c',body:'#4b2e83',leg:'#32205a',arm:'#4b2e83'},
witch:{skin:'#79b85a',body:'#5b2a86',leg:'#2a1a3d'},werewolf:{skin:'#8a6240',body:'#7a5636',leg:'#6a4a2e'},
frank:{skin:'#8fb59a',body:'#2e3445',leg:'#242a38',arm:'#2e3445'}};

/* ---------- примитивы ---------- */
const circ=(x,y,r,f)=>{g.beginPath();g.arc(x,y,r,0,7);g.fillStyle=f;g.fill()};
const el=(x,y,a,b,f)=>{g.beginPath();g.ellipse(x,y,a,b,0,0,7);g.fillStyle=f;g.fill()};
const rr=(x,y,w,h,r,f)=>{g.beginPath();g.roundRect(x,y,w,h,r);g.fillStyle=f;g.fill()};
const ln=(a,b,c,d,col,w)=>{g.beginPath();g.moveTo(a,b);g.lineTo(c,d);g.strokeStyle=col;g.lineWidth=w||2;g.lineCap='round';g.stroke()};
const tri=(a,b,c,d,e,f,col)=>{g.beginPath();g.moveTo(a,b);g.lineTo(c,d);g.lineTo(e,f);g.closePath();g.fillStyle=col;g.fill()};

/* ---------- состояние ---------- */
let flash=0,nightT=0,nid=0;const mons=new Map(),fx=[],gy=()=>[H*.6,H-45];
function puff(x,y,n=16){for(let i=0;i<n;i++)fx.push({k:'c',x:x+R(-20,20),y:y-R(10,70),vx:R(-60,60),vy:R(-90,-10),r:R(10,26),l:0,m:R(.6,1.1),c:pick(['#8e5bd6','#5b3a8c','#c9b6ea','#ff8c1a'])})}
function emo(x,y,ch){fx.push({k:'e',x,y,vx:R(-20,20),vy:-70,l:0,m:1.2,ch})}

function touch(name,col){
  const k=name.toLowerCase(),now=performance.now();let m=mons.get(k);
  if(!m){
    if(mons.size>=MAX){let o=null;for(const v of mons.values())if(!o||v.last<o.last)o=v;if(o)o.dying=o.dying||.001}
    const ty=K[[...k].reduce((a,c)=>a+c.charCodeAt(0),0)%K.length],[a,b]=gy();
    m={name,color:col||'#ffb347',type:ty,x:R(100,W-100),y:R(a,b),ph:R(0,6),dir:1,z:650,vz:0,st:'idle',stT:.5,tx:0,ty:0,
       sp:T[ty].sp*R(.85,1.15),act:null,actT:0,at:0,tg:null,mv:false,bub:'',bubT:0,kx:0,hit:0,dying:0,last:now};
    mons.set(k,m);puff(m.x,m.y);
  }else{m.last=now;m.dying=0;if(col)m.color=col}
  return m;
}
function say(m,t){m.bub=t.slice(0,44);m.bubT=4.5}
function boom(m){puff(m.x,m.y-m.z,30);flash=.8;emo(m.x,m.y-100,'💥');
  for(const o of mons.values())if(o!==m&&Math.hypot(o.x-m.x,(o.y-m.y)*2)<420){o.kx=(o.x<m.x?-1:1)*900;o.vz=520;o.hit=.6;emo(o.x,o.y-100,'💥')}
  m.vz=400;m.hit=.5}
function findT(m,arg){
  const n=(arg||'').replace('@','').toLowerCase(),o=n&&mons.get(n);
  if(o&&o!==m&&!o.dying)return o;
  let b=null,bd=1e9;for(const v of mons.values())if(v!==m&&!v.dying){const d=Math.hypot(v.x-m.x,v.y-m.y);if(d<bd){bd=d;b=v}}
  return b;
}
function act(m,a,arg){
  if(m.dying)return;
  if(a==='jump'){if(!m.z)m.vz=640;return}
  if(a==='candy'){for(let i=0;i<9;i++)emo(m.x+R(-90,90),m.y-R(60,220),pick(['🍬','🍭','🍫','🎃','🍪']));m.act='cheer';m.at=0;m.actT=1.5;return}
  const tg=findT(m,arg);
  if(a==='freeze'){const v=tg||m;v.act='freeze';v.at=0;v.actT=3.5;emo(v.x,v.y-120,'❄️');say(v,'Бррр!');if(v!==m){m.act='cast';m.at=0;m.actT=1}return}
  if(a==='party'){for(const v of mons.values())if(!v.dying){v.act='dance';v.at=R(0,1);v.actT=5}
    emo(m.x,m.y-130,'🎉');for(let i=0;i<10;i++)emo(R(60,W-60),R(H*.3,H*.7),pick(['🎉','🎊','✨']));return}
  if(a==='throw'){m.act='throw';m.at=0;m.actT=.9;
    if(tg){m.dir=tg.x>m.x?1:-1;const dx=tg.x-m.x,dy=tg.y-m.y;
      fx.push({k:'e',x:m.x+m.dir*30,y:m.y-100,vx:dx/.55,vy:(dy+30)/.55,l:0,m:.55,ch:'🎃'});
      setTimeout(()=>{if(!tg.dying){tg.kx=m.dir*500;tg.hit=.5;tg.vz=380;emo(tg.x,tg.y-100,'💥');say(tg,'Ай!')}},550)}
    return}
  if(a==='zap'){const v=tg||m;v.vz=520;v.hit=.7;flash=1;emo(v.x,v.y-120,'⚡');emo(v.x+30,v.y-90,'⚡');puff(v.x,v.y-v.z,8);m.act='cast';m.at=0;m.actT=1.2;return}
  if(a==='gift'){if(tg){emo(tg.x,tg.y-110,'🎁');emo(tg.x+25,tg.y-130,'❤️');emo(m.x,m.y-110,'😊');say(tg,'Спасибо, '+m.name+'!')}m.act='cast';m.at=0;m.actT=1.2;return}
  if(a==='curse'){if(tg){tg.type=pick(K.filter(k=>k!==tg.type));tg.sp=T[tg.type].sp*R(.85,1.15);puff(tg.x,tg.y-tg.z,22);emo(tg.x,tg.y-120,'🔮');say(tg,'Что со мной?!')}m.act='cast';m.at=0;m.actT=1.2;return}
  m.act=a;m.at=0;m.actT={dance:4,spin:1.3,scare:1.8,attack:3,hug:3.5,wave:2,laugh:2,sleep:6,fire:1.8,giant:6,kick:3,tickle:3,boom:1.2,flip:.8,bow:2,sing:4,run:3,love:2.5}[a]||2;
  if(a==='wave')emo(m.x,m.y-120,'👋');
  if(a==='laugh'){say(m,'ХА-ХА-ХА!');m.bubT=2;emo(m.x,m.y-120,'😂')}
  if(a==='fire')emo(m.x+m.dir*40,m.y-120,'🔥');
  if(a==='giant'){say(m,'Я ГИГАНТ!');m.bubT=2}
  if(a==='flip'&&!m.z)m.vz=700;
  if(a==='run'){m.st='idle';m.stT=0;emo(m.x,m.y-80,'💨')}
  if(a==='love')for(let i=0;i<7;i++)emo(m.x+R(-40,40),m.y-R(80,150),pick(['❤️','💖','💗']));
  if(a==='boom'){say(m,'Сейчас рванёт!');m.bubT=1.2}
  if(a==='scare'){say(m,'БУУУ!');m.bubT=1.8;emo(m.x,m.y-110,'👻');
    for(const o of mons.values())if(o!==m&&Math.hypot(o.x-m.x,(o.y-m.y)*2)<380){o.kx=(o.x<m.x?-1:1)*520;if(!o.z)o.vz=380;emo(o.x,o.y-90,'😱')}}
  if(a==='bat'){m.bvx=(Math.random()<.5?-1:1)*R(230,340);puff(m.x,m.y-m.z,10)}
  if(['attack','hug','kick','tickle'].includes(a)){const b=(!arg&&(a==='attack'||a==='kick')&&bossOf())||tg;
    m.tg=b;if(!b){m.act='spin';m.actT=1.2}}
}
const CM={jump:['jump','прыжок','прыг','прыгай'],dance:['dance','танец','танцуй'],spin:['spin','крутись','вертись'],
scare:['boo','бу','scare','напугать'],attack:['attack','атака','бить','fight','бой'],wave:['wave','привет','хай','ку'],laugh:['laugh','смех','хаха','ржу'],sleep:['sleep','сон','спать'],fire:['fire','огонь','дыхание'],
hug:['hug','обнять','обнимашки'],gift:['gift','подарок'],candy:['candy','конфеты','сладость'],curse:['curse','проклятие','заколдовать'],
zap:['zap','молния','гром'],giant:['giant','гигант','расти'],kick:['kick','пнуть','пинок'],tickle:['tickle','щекотать','щекотка'],
party:['party','вечеринка','хоровод'],throw:['throw','бросить','кинуть'],boom:['boom','взрыв','бум'],flip:['flip','сальто','флип'],
bow:['bow','поклон'],sing:['sing','петь','песня'],freeze:['freeze','заморозить','лёд'],run:['run','бег','беги'],love:['love','сердце','люблю']};
function cmd(m,a){
  const c=a[0].toLowerCase(),arg=(a[1]||'').toLowerCase();
  for(const k in CM)if(CM[k].includes(c))return act(m,k,a[1]);
  const byName=K.find(k=>T[k].n.includes(c))||K.find(k=>T[k].n.includes(arg));
  if(byName||['monster','монстр','рандом','random'].includes(c)){
    const ty=byName||pick(K.filter(k=>k!==m.type));m.type=ty;m.sp=T[ty].sp*R(.85,1.15);puff(m.x,m.y-m.z);
  }
}
/* ---------- команды модераторов и стримера ---------- */
const MC={invasion:['invasion','нашествие','орда'],boss:['boss','босс'],night:['night','ночь'],rain:['rain','дождь'],storm:['storm','шторм','гроза'],
chaos:['chaos','хаос'],gather:['gather','сбор'],freezeall:['freezeall','стужа'],clear:['clear','очистить'],out:['out','выгнать'],
form:['form','форма'],giants:['giants','гиганты']};
const bossOf=()=>[...mons.values()].find(v=>v.boss&&!v.dying);
function hitBoss(o,m){o.hp--;o.hit=.3;emo(o.x+R(-40,40),o.y-R(80,170),pick(['💥','💢']));m.vz=250;m.kx=-m.dir*400;
  if(o.hp<=0){puff(o.x,o.y-o.z,40);flash=1;for(let i=0;i<12;i++)emo(R(60,W-60),R(H*.2,H*.7),pick(['🏆','🎉','✨']));say(m,'БОСС ПОВЕРЖЕН!');o.dying=.001}}
function npc(name,ty,life){const m=touch(name,'#9aa0aa');m.npc=1;m.type=ty;m.sp=T[ty].sp*R(.85,1.15);m.last=performance.now()-TTL+life;return m}
function modCmd(m,a){
  const c=a[0].toLowerCase(),arg=(a[1]||'').toLowerCase(),now=performance.now(),k=Object.keys(MC).find(x=>MC[x].includes(c));
  if(!k)return false;
  const all=()=>[...mons.values()].filter(v=>!v.dying);
  if(k==='invasion'){const n=Math.min(+arg||12,30);for(let i=0;i<n;i++)setTimeout(()=>{const v=npc('☠ '+pick(['Зомби','Скелет','Мумия','Призрак','Тыква'])+' '+(++nid),pick(K),45000);v.sp*=1.3},i*150)}
  else if(k==='boss'&&!bossOf()){
    const b=npc('👑 БОСС',pick(['werewolf','zombie','skeleton','frank','pumpkin','vampire']),90000);
    b.boss=1;b.hp=b.hpMax=Math.min(+arg||15,100);b.bigk=2.4;b.color='#ff5050';b.sp=26;flash=.8;say(b,'Я ПРИШЁЛ ЗА ВАМИ!');b.bubT=3;
    b.iv=setInterval(()=>{if(b.dying||mons.get(b.name.toLowerCase())!==b)clearInterval(b.iv);else act(b,'scare')},7000)}
  else if(k==='night')nightT=now+(+arg||30)*1000;
  else if(k==='rain'){const end=now+(+arg||15)*1000,iv=setInterval(()=>{if(performance.now()>end)return clearInterval(iv);
    for(let i=0;i<3;i++)fx.push({k:'e',x:R(0,W),y:-30,vx:R(-20,20),vy:R(250,420),l:0,m:H/300,ch:pick(['🍬','🍭','🍫','🎃','🍪','🍎'])})},120)}
  else if(k==='storm'){nightT=Math.max(nightT,now+6000);let n=0;const iv=setInterval(()=>{flash=.9;const v=pick(all());
    if(v){v.vz=450;v.hit=.5;emo(v.x,v.y-120,'⚡')}if(++n>=8)clearInterval(iv)},450)}
  else if(k==='chaos')all().forEach((v,i)=>setTimeout(()=>act(v,pick(['jump','dance','spin','scare','fire','flip','run','laugh','sing','love'])),i*80));
  else if(k==='gather'){const[a0,b0]=gy();all().forEach(v=>{v.act=null;v.tx=W/2+R(-260,260);v.ty=R(a0,b0);v.st='walk';v.gt=now+6000});
    emo(W/2,H*.5,'📣');setTimeout(()=>all().forEach(v=>{v.act='dance';v.at=R(0,1);v.actT=6}),6000)}
  else if(k==='freezeall')all().forEach(v=>{v.act='freeze';v.at=0;v.actT=4;emo(v.x,v.y-120,'❄️')});
  else if(k==='clear')all().forEach(v=>v.dying=.001);
  else if(k==='out'){const o=mons.get(arg.replace('@',''));if(o)o.dying=.001}
  else if(k==='form'){const ty=K.find(x=>T[x].n.includes(arg))||pick(K);all().forEach(v=>{v.type=ty;v.sp=T[ty].sp*R(.85,1.15);puff(v.x,v.y-v.z,8)})}
  else if(k==='giants')all().forEach(v=>act(v,'giant'));
  return true;
}
const BOTS=['nightbot','streamelements','streamlabs','moobot','fossabot','wizebot','soundalerts'];
function chat(tags,nick,text){
  if(BOTS.includes(nick.toLowerCase()))return;
  const t=tags?Object.fromEntries(tags.split(';').map(s=>s.split('='))):{};
  const isMod=t.mod==='1'||/broadcaster|moderator/.test(t.badges||'')||!!Q.get('testmod');
  const m=touch(t['display-name']||nick,t.color||null);
  text=text.replace(/\x01ACTION |\x01/g,'').trim();
  if(!text)return;
  if(text[0]==='!'){const a=text.slice(1).split(/\s+/);if(a[0]&&!(isMod&&modCmd(m,a)))cmd(m,a)}   // команды на экране не показываются
  else if(BUB)say(m,text);
}

/* ---------- обновление ---------- */
function upd(dt,now){
  const [a0,b0]=gy();
  for(const [k,m] of mons){
    if(m.dying){m.dying+=dt;if(m.dying>.6){puff(m.x,m.y-m.z,18);mons.delete(k)}continue}
    if(now-m.last>TTL){m.dying=.001;continue}
    if(m.z>0||m.vz){m.vz-=1800*dt;m.z+=m.vz*dt;if(m.z<=0){m.z=0;if(m.vz<-250){m.vz*=-.3;puff(m.x,m.y,4)}else m.vz=0}}
    m.x+=m.kx*dt;m.kx*=Math.pow(.02,dt);m.hit=Math.max(0,m.hit-dt);m.bubT=Math.max(0,m.bubT-dt);
    let mv=false,A=m.act;const sp=m.sp*SZ*H/1080*(A==='run'?3.2:m.gt>now?2.2:1);
    if(A){m.at+=dt;m.actT-=dt;if(m.actT<=0){if(A==='boom')boom(m);m.act=A=null}}
    if(A==='bat'){m.x+=m.bvx*dt;m.y+=Math.sin(m.at*2)*20*dt;m.z=140+Math.sin(m.at*5)*30;m.vz=0;m.dir=m.bvx>0?1:-1;if(m.x<60||m.x>W-60)m.bvx*=-1}
    else if(['attack','hug','kick','tickle'].includes(A)){
      const o=m.tg;
      if(!o||o.dying||mons.get(o.name.toLowerCase())!==o)m.act=null;
      else{const dx=o.x-m.x,dy=o.y-m.y,d=Math.hypot(dx,dy);m.dir=dx>0?1:-1;
        if(d<60){if(o.boss){hitBoss(o,m)}else if(A==='hug'){emo(o.x,o.y-110,'❤️');emo(m.x,m.y-130,'❤️');emo(o.x+20,o.y-140,'🥰');say(m,'Обнимашки!');say(o,'❤️');o.vz=260;m.vz=260}
          else if(A==='tickle'){o.act='laugh';o.at=0;o.actT=2.5;emo(o.x,o.y-120,'🤣');say(o,'ХА-ХА-ХА!');m.vz=200}
          else if(A==='kick'){o.kx=m.dir*1300;o.hit=.6;o.vz=750;o.act='spin';o.at=0;o.actT=1.4;emo(o.x,o.y-100,'💢');say(m,'ПЕНАЛЬТИ!');m.bubT=1.2}
          else{o.kx=m.dir*650;o.hit=.5;if(!o.z)o.vz=420;emo(o.x,o.y-100,'💥');say(m,'ХА!');m.bubT=1.2}m.act=null}
        else{const v=340*H/1080;m.x+=dx/d*v*dt;m.y+=dy/d*v*dt;mv=true;m.ph+=dt*14}}
    }
    else if(A==='dance'){if(!m.z&&!m.vz)m.vz=300}
    else if(A==='fire'){if(Math.random()<.8)fx.push({k:'c',x:m.x+m.dir*(30+R(0,70)),y:m.y-m.z-R(60,95),vx:m.dir*R(80,220),vy:R(-40,10),r:R(8,17),l:0,m:.5,c:pick(['#ff5a1a','#ffb02e','#ffe066'])})}
    else if(A==='sleep'){if(Math.random()<.02)emo(m.x+20,m.y-70,'💤')}
    else if(A==='sing'){if(Math.random()<.06)emo(m.x+R(-30,30),m.y-R(100,130),pick(['🎵','🎶','🎤']))}
    else if(A==='love'){if(Math.random()<.08)emo(m.x+R(-30,30),m.y-R(100,130),'❤️')}
    else if(A==='cast'){if(Math.random()<.6)fx.push({k:'c',x:m.x+m.dir*40,y:m.y-m.z-60,vx:m.dir*R(40,120),vy:R(-60,20),r:R(4,8),l:0,m:.6,c:pick(['#c9a0ff','#ffe066','#9fe8ff'])})}
    else if(!A||A==='giant'||A==='run'){
      if(m.st==='idle'){m.stT-=dt;if(m.stT<=0){m.tx=R(60,W-60);m.ty=R(a0,b0);m.st='walk'}}
      else{const dx=m.tx-m.x,dy=m.ty-m.y,d=Math.hypot(dx,dy);
        if(d<8){m.st='idle';m.stT=A==='run'?.05:R(1,4)}
        else{m.x+=dx/d*sp*dt;m.y+=dy/d*sp*dt*.6;if(Math.abs(dx)>3)m.dir=dx>0?1:-1;mv=true;m.ph+=dt*sp/8}}
    }
    m.mv=mv;m.x=Math.max(40,Math.min(W-40,m.x));m.y=Math.max(a0,Math.min(b0,m.y));
  }
}

/* ---------- рисование ---------- */
function drawBat(f){
  g.save();g.scale(1.4,1.4);
